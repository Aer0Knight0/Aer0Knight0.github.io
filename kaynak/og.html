<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:J;font-weight:200 800;src:url(../assets/jakarta-latin.woff2)}
@font-face{font-family:J;font-weight:200 800;src:url(../assets/jakarta-latin-ext.woff2);unicode-range:U+0100-02BA}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:J,sans-serif;color:#fff;background:radial-gradient(110% 120% at 85% 100%,#123392 0%,#081544 50%,#050b24 100%);position:relative}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.4px,transparent 1.5px);background-size:32px 32px}
.b{position:absolute;border-radius:50%}
.in{position:absolute;left:84px;top:96px;right:84px}
.brand{display:flex;align-items:center;gap:20px;font-weight:800;font-size:38px}
.brand img{width:76px;height:76px;border-radius:22px;box-shadow:0 14px 40px rgba(59,130,246,.45)}
h1{font-size:76px;line-height:1.03;letter-spacing:-.035em;font-weight:800;margin-top:48px;max-width:11.5ch}
.g{background:linear-gradient(90deg,#7dd3fc,#60a5fa 45%,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.foot{position:absolute;left:84px;bottom:70px;display:flex;align-items:center;gap:14px;font-size:22px;font-weight:600;color:#a5b0cc}
.foot img{width:44px;height:44px;border-radius:12px}
.pill{position:absolute;right:84px;bottom:70px;font-size:18px;font-weight:800;letter-spacing:.16em;padding:12px 20px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.helm{position:absolute;right:40px;top:40px;width:460px;opacity:.14;transform:rotate(10deg);-webkit-mask-image:radial-gradient(circle,#000 40%,transparent 68%);mask-image:radial-gradient(circle,#000 40%,transparent 68%)}
</style></head><body>
<div class="b" style="left:-200px;top:-260px;width:700px;height:700px;background:radial-gradient(circle,rgba(29,78,216,.5),transparent 65%)"></div>
<div class="b" style="right:-160px;top:-60px;width:620px;height:620px;background:radial-gradient(circle,rgba(139,92,246,.3),transparent 65%)"></div>
<div class="dots"></div>
<img class="helm" src="../assets/logo.webp">
<div class="in">
  <div class="brand"><img src="../assets/logo.webp">Aer0Knight</div>

</div>
<div class="foot"><img src="../assets/dosedial-icon.webp">DoseDial · çok yakında Google Play'de</div>
<div class="pill">YAKINDA · SOON</div>
